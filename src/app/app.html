<div class ="dashboard">
<h1>{{ title }}</h1>
<input
  type="text"
  placeholder="Enter a task"
  aria-label="Task"
  (input)="taskInput  = $any($event.target).value"
>

<button (click)="addTask()">Add Task</button>

<h2>Tasks</h2>

@for (item of taskList; track $index) {
  <div>
    <span>{{ item }}</span>
    <button (click)="deleteTask($index)">Delete</button>
  </div>
}

</div>
