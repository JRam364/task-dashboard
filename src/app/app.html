<div class ="dashboard">
  <h1>{{ title }}</h1>

  <div class="task-form">
    <input
    type="text"
    class="task-input"
    placeholder="Enter a task"
    aria-label="Task"
    [value]="taskInput"
    (input)="taskInput = $any($event.target).value"
  >

    <input
      type="time"
      class="time-input"
      aria-label="Due time"
      [value]="taskTime"
      (input)="taskTime = $any($event.target).value"
    >

    <button class="add-button" (click)="addTask()">Add Task</button>
  </div>
 
  <div class="task-stats">
  <div class="stat-box">
    <span>Active Tasks</span>
    <strong>{{ activeCount }}</strong>
  </div>

  <div class="stat-box">
    <span>Completed Tasks</span>
    <strong>{{ completedCount }}</strong>
  </div>
</div>
  <hr>
    <h2>My Tasks</h2>

    @for (item of taskList; track $index) {
      <div class="task-item">
        <span
           class="task-name"
            [class.completed]="item.completed"
            (click)="toggleTask($index)"
            (keydown.enter)="toggleTask($index)"
            (keydown.space)="$event.preventDefault(); toggleTask($index)"
            role="button"
            tabindex="0"
            [attr.aria-pressed]="item.completed"
          >
      {{ item.name }}
        </span>



        <button class="delete-button" (click)="deleteTask($index)">Delete</button>
      </div>
    }
  
</div>

<div class="weather-widget">
  <h2>Weather</h2>
  
    <p>Mattoon, IL</p>

  @if (temperature() !== null) {
    <p>Current temperature: {{ temperature() }}°F</p>
  } @else {
    <p>Loading weather...</p>
  }
</div>
